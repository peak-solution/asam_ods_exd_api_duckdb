[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["protobuf_generated"]
py-modules = [
    "external_data_file",
    "exd_duckdb_server",
    "values_append_service",
]

[tool.setuptools.package-data]
protobuf_generated = ["*.pyi"]

[project]
name = "asam-ods-exd-api-duckdb"
version = "0.9.1"
description = "ASAM ODS EXD API implementation to read external data from DuckDB files."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "peak-solution"}]
keywords = ["ASAM", "ODS", "EXD-API", "DuckDB", "measurement data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb",
    "ods-exd-api-box>=1.5.0,<2.0.0",
    "grpcio>=1.71.0,<2.0.0",
    "grpcio-health-checking>=1.71.0,<2.0.0",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "coverage>=7.0",
    "grpcio-tools>=1.71.0,<2.0.0",
    "jupyterlab>=4.0",
    "mypy>=1.5",
    "pytest>=9.1.1",
    "ruff>=0.1.0",
    "types-grpcio>=1.0.0.20260614",
    "types-protobuf>=7.34.1.20260518",
]

[project.urls]
Homepage = "https://github.com/peak-solution/asam_ods_exd_api_duckdb"
Repository = "https://github.com/peak-solution/asam_ods_exd_api_duckdb"
Issues = "https://github.com/peak-solution/asam_ods_exd_api_duckdb/issues"

[project.scripts]
asam-ods-exd-api-duckdb = "exd_duckdb_server:main"

[tool.ruff]
line-length = 119
target-version = "py314"
extend-exclude = ["*.ipynb", "*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
exclude = '(^|/)(build|\.venv|\.mypy_cache)(/|$)'

[[tool.mypy.overrides]]
module = "asammdf.*"
ignore_missing_imports = true
